[project]
name = "jsan-road-event-intelligence"
version = "1.0.0"
description = "JSAN Road Event Intelligence (REI) platform"
requires-python = ">=3.12"

[tool.pytest.ini_options]
# Repository root: connectors/, services/, packages/, database/.  apps/api: the `app` package.
pythonpath = [".", "apps/api"]
testpaths = ["tests", "apps/api/tests"]
addopts = "--import-mode=importlib"

[tool.ruff]
line-length = 100
