[project]
name = "jsan-road-event-intelligence"
version = "1.0.0"
description = "JSAN Road Event Intelligence (REI) platform"
requires-python = ">=3.12"

[tool.pytest.ini_options]
# backend/ holds the `app` package and connectors/, services/, packages/;
# database/ (migrations) is beside it at the repository root.
pythonpath = ["."]
testpaths = ["tests"]
addopts = "--import-mode=importlib"

[tool.ruff]
line-length = 100
